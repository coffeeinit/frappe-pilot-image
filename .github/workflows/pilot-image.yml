name: Build and publish Pilot image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read latest official Pilot release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release="$(curl -fsSL --retry 3 'https://api.github.com/repos/frappe/pilot/releases?per_page=1' | jq -r '.[0].tag_name')"
          test -n "$release" && test "$release" != "null"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Official Pilot release: $release"

      - name: Check whether this release image already exists
        id: decision
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/frappe-pilot
          RELEASE: ${{ steps.release.outputs.release }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          should_build=true
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            if docker manifest inspect "$IMAGE:$RELEASE" >/dev/null 2>&1; then
              should_build=false
            fi
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  build-and-push:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release-tagged and latest images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PILOT_EXPECTED_RELEASE=${{ needs.check-release.outputs.release }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/frappe-pilot:${{ needs.check-release.outputs.release }}
            ghcr.io/${{ github.repository_owner }}/frappe-pilot:latest
          labels: |
            org.opencontainers.image.version=${{ needs.check-release.outputs.release }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
